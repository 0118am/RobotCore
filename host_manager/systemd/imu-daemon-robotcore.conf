[Unit]
# RobotCore requires this daemon and its filesystem socket before the ZED SDK
# can open the GMSL camera. Stop it with the graph and start it after ZEDX.
PartOf=robotcore.service
Before=robotcore.service

[Service]
# IMU_Daemon owns this socket but leaves its path behind after a clean stop.
ExecStartPre=-/usr/bin/rm -f /tmp/imu_daemon.sock
# Type=simple only confirms that exec() succeeded. Hold dependent units until
# the daemon has actually bound the socket used by libsl_zed.
ExecStartPost=/usr/bin/bash -c 'for attempt in {1..50}; do /usr/bin/test -S /tmp/imu_daemon.sock && exit 0; /usr/bin/sleep 0.1; done; exit 1'
