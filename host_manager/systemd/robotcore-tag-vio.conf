# Use the workspace that contains the trusted AprilTag map->odom alignment
# authority. The edge environment file owns ROBOTCORE_WORKSPACE and can
# override Environment= assignments, so source this verified workspace
# directly while retaining its serial-port and managed-map variables.
[Service]
ExecStart=
ExecStart=/usr/bin/bash -lc 'source /home/nvidia/RobotCore/ros_ws/install/setup.bash && exec ros2 launch eup_bringup eup_edge_system.launch.py enable_web_ui:=false serial_port:="${ROBOTCORE_ABOARD_PORT}" apriltag_tag_map_file:="${ROBOTCORE_APRILTAG_MAP_FILE}"'
