# Preserve robotcore.service's private /tmp while making only the NVIDIA
# camera IPC sockets required by the ZED SDK visible to its child process.
[Unit]
After=nvargus-daemon.service
Wants=nvargus-daemon.service

[Service]
BindReadOnlyPaths=/tmp/argus_socket
BindReadOnlyPaths=/tmp/imu_daemon.sock
# ZED X's BMI motion sensor is exposed by the kernel as root:imu 0660.
# Give only the robot runtime that existing device group; do not relax udev
# permissions for other users.
SupplementaryGroups=imu
