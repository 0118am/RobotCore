scenarios:
  pose_hold:
    trajectory_type: move_to_hold
    attitude_mode: fixed_identity
    relative_to_initial_pose: false
    center_x: 3.0
    center_y: 1.0
    center_z: 0.5
    move_duration_s: 18.0
    hold_before_motion_s: 0.0
    default_duration_s: 30.0

  step_x:
    trajectory_type: step_x
    attitude_mode: hold_initial
    step_amplitude: 0.10
    step_time_s: 5.0
    default_duration_s: 20.0
  step_y:
    trajectory_type: step_y
    attitude_mode: hold_initial
    step_amplitude: 0.10
    step_time_s: 5.0
    default_duration_s: 20.0
  step_z:
    trajectory_type: step_z
    attitude_mode: hold_initial
    step_amplitude: 0.10
    step_time_s: 5.0
    default_duration_s: 20.0
  step_roll:
    trajectory_type: step_roll
    attitude_mode: hold_initial
    step_amplitude: 5.0
    step_time_s: 5.0
    default_duration_s: 20.0
  step_pitch:
    trajectory_type: step_pitch
    attitude_mode: hold_initial
    step_amplitude: 5.0
    step_time_s: 5.0
    default_duration_s: 20.0
  step_yaw:
    trajectory_type: step_yaw
    attitude_mode: hold_initial
    step_amplitude: 15.0
    step_time_s: 5.0
    default_duration_s: 20.0

  pose_lissajous_6dof:
    trajectory_type: pose_lissajous_6dof
    attitude_mode: six_dof_sine
    hold_before_motion_s: 10.0
    amp_x: 0.30
    amp_y: 0.20
    amp_z: 0.10
    period_s: 30.0
    roll_amplitude_deg: 5.0
    pitch_amplitude_deg: 5.0
    yaw_amplitude_deg: 15.0
    attitude_period_s: 30.0
    default_duration_s: 70.0
