# Stable ZED X Mini profile for GEN_3 VIO plus AprilTag global localisation.
# Camera acquisition remains at 30 Hz for exposure timing, while SDK compute
# and ROS publication are capped at the sustainable 15 Hz processing rate.
---
/**:
  ros__parameters:
    general:
      camera_model: zedxm
      camera_name: zedx
      serial_number: 0
      camera_id: 1
      grab_resolution: SVGA
      # Keep physical acquisition at 30 Hz for short exposure intervals.
      grab_frame_rate: 30
      # Publish the native 960x600 frame without an unnecessary resize path.
      pub_resolution: NATIVE
      # Process and publish at a rate that fits the measured platform budget.
      # The capture sensor continues running at 30 Hz independently.
      grab_compute_capping_fps: 15.0
      pub_frame_rate: 15.0
      # Keep the SDK's camera clock immune to NTP/system-clock steps.  The
      # wrapper converts this monotonic timestamp back into the ROS epoch at
      # camera open, so delayed AprilTag measurements remain replayable by the
      # fixed-lag estimator without inheriting publication latency.
      sdk_use_monotonic_clock: true
      camera_timeout_sec: 5
      camera_max_reconnect: 5
      # This is the deployed stereo calibration for the
      # ZED X Mini with serial 50649148. Install it at this service-readable
      # path; the ZED SDK then uses it to generate the rectified image and
      # CameraInfo.P consumed by AprilTag PnP.
      optional_opencv_calibration_file: /etc/robotcore/zed_calibration_50649148.yml
      # Do not let the SDK refine/replace the externally supplied intrinsics.
      self_calib: false

    video:
      publish_rgb: true
      # Retrieve LEFT_BGR directly into GPU memory. Isaac ROS cuAprilTags
      # accepts BGR8, so the NITROS stream needs neither an alpha-channel
      # removal nor an RGB channel swap.
      enable_24bit_output: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    # Keep localisation and operator video on separate quality paths. Isaac
    # ROS consumes the uncompressed rectified image above at 960x600/30 Hz;
    # only image_transport's browser-facing JPEG publisher is compressed more
    # aggressively. The parameter prefix follows the ZED image publisher's
    # resolved topic under the /zedx namespace.
    # The leading dot is part of the parameter name declared by the Humble
    # compressed_image_transport plugin for this fully resolved ZED topic.
    ".zed_node":
      rgb:
        color:
          rect:
            image:
              format: jpeg
              # High-quality operator view.  This encoder remains completely
              # idle until the web bridge creates a compressed-topic
              # subscription, so this setting cannot affect the always-on
              # NITROS AprilTag image when video forwarding is off.
              jpeg_quality: 80

    depth:
      # ZED SDK 5.2+ GEN_3 positional tracking operates without depth. No
      # production consumer uses a depth product, so avoid neural depth work.
      depth_mode: NONE
      depth_stabilization: 0
      publish_depth_map: false
      publish_depth_info: false
      publish_point_cloud: false
      publish_depth_confidence: false
      publish_disparity: false

    pos_tracking:
      # ZED VIO is the continuous local motion source. AprilTag only estimates
      # map->odom, so ZED never publishes dynamic TF or resets its odom frame.
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_3
      imu_fusion: true
      publish_tf: false
      publish_map_tf: false
      area_memory: false
      reset_odom_with_loop_closure: false
      publish_odom_pose: true
      # Expose the SDK pose covariance explicitly as well as carrying it in
      # the odometry message consumed by the VIO/Tag EKF.
      publish_pose_cov: true
      publish_cam_path: false

    sensors:
      # The SDK still fuses its factory-calibrated IMU internally for VIO.
      # No ZED sensor stream is duplicated onto ROS because nothing consumes it.
      publish_imu: false
      publish_imu_raw: false
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: false
      publish_imu_tf: false

    mapping:
      mapping_enabled: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false

    stream_server:
      stream_enabled: false

    debug:
      # AprilTag consumes the GPU-backed BGR8 NITROS image directly. The ZED
      # wrapper retains only an on-demand JPEG transport for the operator switch.
      disable_nitros: false
      # Preserve the SDK camera timestamp; replacing it with ROS now() would
      # turn processing and DDS queueing delay into a measurement-time error.
      use_pub_timestamps: false
      sdk_verbose: 1
