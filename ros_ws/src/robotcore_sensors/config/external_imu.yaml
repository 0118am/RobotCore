imu_conditioning:
  ros__parameters:
    input_topic: /hardware/aboard_imu_raw
    # Factory-calibrated specific force retains gravity for telemetry consumers.
    # Vectors and covariances are rotated into base_link.
    output_topic: /sensors/external_imu
    # The vendor protocol exposes no filter/bandwidth command. These timestamp-
    # aware host filters suppress sensor noise without assuming exactly 100 Hz.
    gyro_low_pass_cutoff_hz: 20.0
    accel_low_pass_cutoff_hz: 15.0
    filter_reset_gap_s: 0.20
    gyro_noise_floor_rps: 0.01
    accel_noise_floor_mps2: 0.15
    # Confirm this mounting rotation with a physical FLU axis test.
    base_to_imu_rpy_rad: [0.0, 0.0, 0.0]
    base_frame_id: base_link
