# Validated eight-thruster model in base_link FLU coordinates. Every
# position_m is already relative to the centre of mass; it must not be offset
# a second time. T4, T5 and T7 use the supplied mirrored estimates.
measured: true
damping: 0.0001
axis_weights: [1.0, 1.0, 1.0, 0.5, 0.5, 0.5]

# Hardware commands remain normalized against the bridge's +/-500 us span.
# The model clamps physical PWM to 1300..1700 us and maps the +/-25 us
# deadband to zero force. Thus model-valid normalized commands are +/-0.4.
pwm_force_model:
  neutral_pwm_us: 1500.0
  minimum_pwm_us: 1300.0
  maximum_pwm_us: 1700.0
  deadband_us: 25.0
  hardware_span_us: 500.0

