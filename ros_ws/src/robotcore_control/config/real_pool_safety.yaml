command_authority:
  ros__parameters:
    publish_rate_hz: 100.0
    candidate_timeout_s: 0.10
    state_timeout_s: 0.15
    target_timeout_s: 0.15
    safety_heartbeat_timeout_s: 0.25
    automatic_command_limit: 0.15
    automatic_slew_rate_per_s: 0.5
    allow_rl_hardware: false
    # SAFETY: replace the values and set true only after the AprilTag map and
    # physical pool envelope have been measured.
    pool_bounds_configured: false
    pool_min_xyz: [0.0, 0.0, 0.0]
    pool_max_xyz: [0.0, 0.0, 0.0]

trajectory_command:
  ros__parameters:
    publish_rate_hz: 60.0
    relative_to_initial_pose: true
    require_pool_bounds: true
    pool_min_xyz: [0.0, 0.0, 0.0]
    pool_max_xyz: [0.0, 0.0, 0.0]
    # SAFETY: set true only after all limits below have been approved on site.
    trajectory_limits_configured: false
    max_linear_speed_mps: 0.0
    max_angular_speed_rps: 0.0
    attitude_min_rpy_deg: [0.0, 0.0, 0.0]
    attitude_max_rpy_deg: [0.0, 0.0, 0.0]
    trajectory_type: hold
    attitude_mode: hold_initial
