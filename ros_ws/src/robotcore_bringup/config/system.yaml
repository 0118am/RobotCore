fixed_stack:
  ubuntu: "22.04"
  ros2: "humble"
  ros2_control:
    - ros-humble-ros2-control
    - ros-humble-ros2-controllers

topics:
  imu: /sensors/external_imu
  body_state: /robot/body_state
  localization_status: /localization/status
  thruster_cmd: /control/thruster_cmd
  body_policy_status: /policy/body/status
  safety_events: /safety/events
  board_status: /hardware/board_status

control:
  thruster_count: 8
  action_min: -1.0
  action_max: 1.0
  pwm_neutral_us: 1500
  action_pwm_span_us: 250

runtime:
  run_root: data/robotcore_runs
