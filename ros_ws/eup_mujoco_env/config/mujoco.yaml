mujoco:
  model_path: eup_mujoco_env/models/bluerov2_heavy_generic.xml
  publish_rate_hz: 50.0
  physics_steps_per_tick: 0
  real_time_factor: 1.0
  enable_viewer: false
  viewer_sync_every_n_steps: 1
  enable_hydrodynamics: false
  thruster_force_model: isaac_warpauv
  thruster_deadband: 0.08
  thruster_rotor_constant: 0.001
  thruster_time_constant_s: 0.05
  use_sim_time: true

outputs:
  clock: /clock
  imu: /sensors/imu
  depth_image: /sensors/front_depth/image
  front_camera: /sensors/front_camera/image_raw
  body_state: /robot/body_state
  arm_state: /robot/arm_state
  thruster_state: /robot/thruster_state
  status: /mujoco/status

inputs:
  thruster_cmd: /control/thruster_cmd
  arm_cmd: /control/arm_cmd
  command_service: /mujoco/command
