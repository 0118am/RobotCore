output_schema:
  type: direct_thruster_action
  size: 8
  range: [-1.0, 1.0]
  output_layer: tanh
  direct_hardware_command: true
  pwm_mapping: "PWM_us = 1500 + 250 * action"
  channel_order:
    - T1_front_right_vertical
    - T2_rear_right_vertical
    - T3_front_left_vertical
    - T4_rear_left_vertical
    - T5_rear_left_horizontal
    - T6_rear_right_horizontal
    - T7_front_left_horizontal
    - T8_front_right_horizontal

deployment_validation:
  mode: direct_thruster_action
  authority: current_physical_vehicle
  actuator_alignment: trained_physical_T1_T8
  state_frame: robotcore_FLU
  angular_velocity_frame: body_xyz

